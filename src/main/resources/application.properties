spring.application.name=BookCatalog

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:bookcatalog;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea y actualiza las tablas automáticamente (ideal para pruebas rápidas)
spring.jpa.hibernate.ddl-auto=update

# Opcional: consola web en http://localhost:8080/h2-console para ver los datos
spring.h2.console.enabled=true
